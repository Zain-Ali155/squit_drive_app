packages:
  - "apps/*"
  - "servers/*"
  - "packages/*"
  - "prebuilt/*"
  - "prebuilt/*/*"

allowBuilds:
  esbuild: true
  unrs-resolver: true

audit:
  level: high

minimumReleaseAgeExclude:
  - next@16.3.6 || 16.3.8 || 16.4.1
  - source-map-js@1.2.2
  - sharp@0.35.5
  - '@modelcontextprotocol/sdk@1.30.1 || 1.31.0 || 1.32.0'
  - zod@4.6.6
  - body-parser@2.4.0
  - undici@7.30.1
  - systeminformation@5.33.16
